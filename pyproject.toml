[project]
name = "banking-concierge"
version = "0.1.0"
description = "Meridian National personal banking customer service concierge demo for LangSmith Engine"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "langgraph>=1.2.22",
    "langchain>=1.5.0",
    "langchain-core>=1.8.1",
    "langchain-openai>=1.8.0",
    "langchain-text-splitters>=1.1.3",
    "langsmith>=0.15.0",
    "python-dotenv>=1.2.4",
    "langgraph-sdk>=0.4.14",
    "numpy>=2.4.6",
    "fastapi>=0.163.2",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.43",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/concierge"]
